<meta charset="utf-8">

<title>FD Biologie I – Listen-Trainer V1–V6</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e2e0d8;
  --accent:#2563eb; --accent-soft:#e7effd; --good:#1f8a4c; --good-soft:#e5f4e9;
  --bad:#c0392b; --bad-soft:#fbebea; --warn:#b7791f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181c; --card:#1f2228; --ink:#eceff3; --muted:#a2a9b3; --line:#30343c;
    --accent:#6ea0ff; --accent-soft:#22304a; --good:#4cc07f; --good-soft:#1d3327; --bad:#ff7b6e; --bad-soft:#3a2321; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:22px;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:18px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.mode b{display:block;font-size:16px}
.mode span{color:var(--muted);font-size:13px}
.mode[disabled]{opacity:.4;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.q{font-size:19px;font-weight:600;margin:10px 0 14px}
.answer{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;white-space:pre-line}
.btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good)}
.btn.bad{background:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.feedback{margin-top:10px;font-size:15px}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.order-list{list-style:none;padding:0;margin:0}
.order-list li{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.order-list li .n{width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.order-list li .t{flex:1}
.order-list li button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer}
.order-list li.right{border-color:var(--good);background:var(--good-soft)}
.order-list li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.result{font-size:40px;font-weight:700;margin:6px 0}
.small{font-size:13px;color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
</style>
</head>

/* ===================== LOGIK ===================== */
const MODES = [
  {id:"cards", name:"Karteikarten", desc:"Frage lesen, Antwort aufdecken, selbst bewerten"},
  {id:"sort",  name:"Zuordnen",     desc:"Begriff der richtigen Kategorie zuordnen"},
  {id:"order", name:"Reihenfolge",  desc:"Listen in die richtige Reihenfolge bringen"},
  {id:"tf",    name:"Richtig/Falsch", desc:"Aussagen prüfen, mit Begründung"},
  {id:"mix",   name:"Prüfungsmix",  desc:"Alles gemischt"},
  {id:"wrong", name:"Nur Fehler",   desc:"Was du falsch hattest, nochmals"}
];

let sel = new Set(Object.keys(LECTURES));
let WRONG = loadWrong();
let queue = [], idx = 0, score = 0, answered = false;

function loadWrong(){ try{ return new Set(JSON.parse(localStorage.getItem("fd1-wrong")||"[]")); }catch(e){ return new Set(); } }
function saveWrong(){ try{ localStorage.setItem("fd1-wrong", JSON.stringify([...WRONG])); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* Alle Aufgaben als Einheiten mit stabiler ID */
function allTasks(){
  const t=[];
  CARDS.forEach((c,i)=>t.push({type:"cards", id:"c"+i, v:c.v, data:c}));
  SORTS.forEach((g,gi)=>g.items.forEach((it,ii)=>t.push({type:"sort", id:"s"+gi+"-"+ii, v:g.v, data:{group:g, item:it}})));
  ORDERS.forEach((o,i)=>t.push({type:"order", id:"o"+i, v:o.v, data:o}));
  TFS.forEach((f,i)=>t.push({type:"tf", id:"t"+i, v:f.v, data:f}));
  return t;
}
const TASKS = allTasks();

function available(mode){
  return TASKS.filter(t=>sel.has(t.v) && (
    mode==="mix" ? true :
    mode==="wrong" ? WRONG.has(t.id) :
    t.type===mode));
}

function renderHome(){
  document.getElementById("play").hidden = true;
  document.getElementById("home").hidden = false;
  const L = document.getElementById("lectures");
  const allOn = sel.size===Object.keys(LECTURES).length;
  L.innerHTML = `<button class="chip ${allOn?'on':''}" data-all="1">Alle</button>` +
    Object.entries(LECTURES).map(([k,n])=>`<button class="chip ${sel.has(k)&&!allOn?'on':''}" data-v="${k}">${k} ${esc(n)}</button>`).join("");
  L.onclick = e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.all){ sel=new Set(Object.keys(LECTURES)); }
    else { const v=b.dataset.v; if(allOn) sel=new Set([v]); else { sel.has(v)?sel.delete(v):sel.add(v); if(!sel.size) sel=new Set(Object.keys(LECTURES)); } }
    renderHome();
  };
  const M = document.getElementById("modes");
  M.innerHTML = MODES.map(m=>{ const n=available(m.id).length; return `<button class="mode" data-m="${m.id}" ${n?'':'disabled'}><b>${m.name}</b><span>${esc(m.desc)} · ${n}</span></button>`; }).join("");
  M.onclick = e=>{ const b=e.target.closest("button"); if(!b||b.disabled) return; start(b.dataset.m); };
  const tot = TASKS.filter(t=>sel.has(t.v)).length;
  document.getElementById("stats").innerHTML = `${tot} Aufgaben in der Auswahl · ${[...WRONG].length} Fehler gespeichert` +
    (WRONG.size?` · <a href="#" id="reset">Fehlerliste leeren</a>`:"");
  const r=document.getElementById("reset"); if(r) r.onclick=e=>{e.preventDefault(); WRONG=new Set(); saveWrong(); renderHome();};
}

function start(mode){
  queue = shuffle(available(mode)); idx=0; score=0;
  document.getElementById("home").hidden = true;
  document.getElementById("play").hidden = false;
  renderTask();
}

function header(t){
  const pct = Math.round(idx/queue.length*100);
  return `<div class="topbar"><span><span class="tag">${t.v}</span> ${idx+1} / ${queue.length}</span><span>Punkte ${score}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
}

function mark(t, ok){
  if(ok){ score++; WRONG.delete(t.id); } else { WRONG.add(t.id); }
  saveWrong();
}

function next(){ idx++; if(idx>=queue.length) return finish(); renderTask(); }

function renderTask(){
  answered=false;
  const t = queue[idx], P = document.getElementById("play");
  const quit = `<button class="btn ghost" id="quit">Zurück</button>`;
  if(t.type==="cards"){
    P.innerHTML = header(t) + `<div class="q">${esc(t.data.q)}</div>
      <div class="answer" id="ans" hidden>${esc(t.data.a)}</div>
      <div class="btns" id="b"><button class="btn" id="show">Antwort zeigen</button>${quit}</div>`;
    document.getElementById("show").onclick=()=>{
      document.getElementById("ans").hidden=false;
      document.getElementById("b").innerHTML = `<button class="btn good" id="y">Gewusst</button><button class="btn bad" id="n">Nicht gewusst</button>${quit}`;
      document.getElementById("y").onclick=()=>{mark(t,true);next();};
      document.getElementById("n").onclick=()=>{mark(t,false);next();};
      document.getElementById("quit").onclick=renderHome;
    };
  }
  else if(t.type==="sort"){
    const g=t.data.group, [term, right]=t.data.item;
    let opts = g.cats.length<=5 ? g.cats.slice() : [right, ...shuffle(g.cats.filter(c=>c!==right)).slice(0,3)];
    opts = g.cats.length<=5 ? opts : shuffle(opts);
    P.innerHTML = header(t) + `<div class="small">${esc(g.title)}</div><div class="q">${esc(term)}</div><div class="small">${esc(g.prompt)}</div>
      <div id="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div><div class="btns">${quit}</div>`;
    document.getElementById("opts").onclick=e=>{
      const b=e.target.closest(".opt"); if(!b||answered) return; answered=true;
      const ok = b.dataset.o===right;
      document.querySelectorAll(".opt").forEach(x=>{ if(x.dataset.o===right) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
      document.getElementById("fb").className="feedback "+(ok?"ok":"no");
      document.getElementById("fb").textContent = ok?"Richtig.":"Falsch. Richtig ist: "+right;
      mark(t,ok);
      document.querySelector(".btns").innerHTML = `<button class="btn" id="nx">Weiter</button>${quit}`;
      document.getElementById("nx").onclick=next; document.getElementById("quit").onclick=renderHome;
    };
  }
  else if(t.type==="order"){
    let cur = shuffle(t.data.items);
    if(cur.every((x,i)=>x===t.data.items[i]) && cur.length>1) cur=cur.reverse();
    const draw=(check)=>{
      const off = t.data.title.includes("0–7")?0:1;
      const ul = cur.map((x,i)=>{
        const cls = check ? (x===t.data.items[i]?"right":"wrong") : "";
        return `<li class="${cls}"><span class="n">${i+off}.</span><span class="t">${esc(x)}</span>${check?"":`<button data-up="${i}" aria-label="nach oben">↑</button><button data-dn="${i}" aria-label="nach unten">↓</button>`}</li>`;
      }).join("");
      P.innerHTML = header(t) + `<div class="q">${esc(t.data.title)}</div><div class="small">Mit den Pfeilen in die richtige Reihenfolge bringen.</div>
        <ul class="order-list" id="ol">${ul}</ul><div class="feedback" id="fb"></div>
        <div class="btns">${check?`<button class="btn" id="nx">Weiter</button>`:`<button class="btn" id="chk">Prüfen</button>`}${quit}</div>`;
      document.getElementById("quit").onclick=renderHome;
      if(check){
        const n = cur.filter((x,i)=>x===t.data.items[i]).length, ok = n===cur.length;
        const fb=document.getElementById("fb"); fb.className="feedback "+(ok?"ok":"no");
        fb.innerHTML = ok ? "Alles richtig." : `${n} von ${cur.length} richtig. Korrekte Reihenfolge:<br>` + t.data.items.map((x,i)=>`${i+off}. ${esc(x)}`).join("<br>");
        document.getElementById("nx").onclick=next;
        return ok;
      }
      document.getElementById("ol").onclick=e=>{
        const b=e.target.closest("button"); if(!b) return;
        if(b.dataset.up){ const i=+b.dataset.up; if(i>0){[cur[i-1],cur[i]]=[cur[i],cur[i-1]];} }
        if(b.dataset.dn){ const i=+b.dataset.dn; if(i<cur.length-1){[cur[i+1],cur[i]]=[cur[i],cur[i+1]];} }
        draw(false);
      };
      document.getElementById("chk").onclick=()=>{ const ok=draw(true); mark(t,ok); };
    };
    draw(false);
  }
  else if(t.type==="tf"){
    const f=t.data;
    P.innerHTML = header(t) + `<div class="q">${esc(f.s)}</div>
      <div id="opts"><button class="opt" data-a="1">Richtig</button><button class="opt" data-a="0">Falsch</button></div>
      <div class="feedback" id="fb"></div><div class="btns">${quit}</div>`;
    document.getElementById("opts").onclick=e=>{
      const b=e.target.closest(".opt"); if(!b||answered) return; answered=true;
      const choice = b.dataset.a==="1", ok = choice===f.t;
      document.querySelectorAll(".opt").forEach(x=>{ if((x.dataset.a==="1")===f.t) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
      const fb=document.getElementById("fb"); fb.className="feedback "+(ok?"ok":"no");
      fb.textContent = (ok?"Richtig. ":"Falsch. ") + f.why;
      mark(t,ok);
      document.querySelector(".btns").innerHTML = `<button class="btn" id="nx">Weiter</button>${quit}`;
      document.getElementById("nx").onclick=next; document.getElementById("quit").onclick=renderHome;
    };
  }
  const q=document.getElementById("quit"); if(q) q.onclick=renderHome;
}

function finish(){
  const pct = queue.length ? Math.round(score/queue.length*100) : 0;
  document.getElementById("play").innerHTML = `<div class="small">Durchgang beendet</div>
    <div class="result">${score} / ${queue.length}</div>
    <div>${pct} % richtig · ${WRONG.size} Fehler gespeichert</div>
    <div class="btns"><button class="btn" id="again">Fehler wiederholen</button><button class="btn ghost" id="home2">Startseite</button></div>`;
  document.getElementById("home2").onclick=renderHome;
  const a=document.getElementById("again");
  if(!available("wrong").length){ a.disabled=true; a.textContent="Keine Fehler offen"; }
  a.onclick=()=>start("wrong");
}

renderHome();
</script>
